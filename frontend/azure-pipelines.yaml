trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

- script: |
    docker --version
    docker build -t patil8333/myapp:latest ./frontend
  displayName: 'Build Docker Image'

- task: Docker@2
  displayName: 'Push Docker Image'
  inputs:
    containerRegistry: 'dockerhubconnection'
    repository: 'patil8333/myapp'
    command: 'push'
    tags: |
      latest

- script: |
    docker images
  displayName: 'Check Docker Image'
 